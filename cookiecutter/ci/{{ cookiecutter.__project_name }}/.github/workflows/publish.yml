{%- import 'macros' as macros with context -%}
---
name: "Publish"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    uses: "./.github/workflows/build.yml"
  publish-pypi:
    name: "Publish to PyPI"
    needs: "build"
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
    permissions:
      id-token: "write"
    steps:
      {{ macros.download_wheels() | indent(6) }}
      {{ macros.install_uv(cache=False) | indent(6) }}
      - name: "Publish"
        run: |
          uv publish
...
