---
name: "Publish"

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    uses: "./.github/workflows/build.yml"
  publish-pypi:
    name: "Publish to PyPI"
    needs: "build"
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/pulp-cli"
    steps:
      - name: "Download wheels"
        uses: "actions/download-artifact@v8"
        with:
          name: "pulp_cli_packages"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true
      - name: "Publish"
        run: |
          uv publish
...
